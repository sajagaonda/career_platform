<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안심동선 - 장애인 맞춤형 사전 위험 동선 점검 & 현장 안전 케어 (가칭)</title>
  <meta name="description" content="안전사고 우려로 여행을 주저하는 장애인과 가족을 위해 사전 위험 동선을 점검하고 현장 위기관리 체계를 제공하는 안전 전문 컨설팅 서비스">
  <style>
    /* ==========================================
       1. DESIGN TOKENS & RESET
       ========================================== */
    :root {
      --primary: #1E3A8A;        /* 안심과 신뢰의 딥 블루 */
      --primary-light: #3B82F6;  /* 비브런트 블루 */
      --secondary: #0D9488;      /* 평온한 틸/그린 */
      --accent: #F59E0B;         /* 따뜻한 주황 (주의/강조) */
      --bg-main: #F8FAFC;        /* 깔끔하고 여유로운 배경 */
      --bg-card: #FFFFFF;
      --text-main: #0F172A;      /* 높은 대비의 본문 색상 */
      --text-muted: #475569;
      --border: #E2E8F0;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 20px 30px -10px rgba(30, 58, 138, 0.15);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --font-stack: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
